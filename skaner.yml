name: Skaner GPW

on:
  schedule:
    # godziny w UTC: 07:05 (rano przed sesją) i 16:20 (po zamknięciu sesji), pon-pt
    - cron: "5 7 * * 1-5"
    - cron: "20 16 * * 1-5"
  workflow_dispatch: {}   # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write

jobs:
  skan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python skaner.py --out docs/index.html --no-open
      - name: Zapisz raport
        run: |
          git config user.name "skaner-bot"
          git config user.email "skaner-bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Raport $(date -u +'%Y-%m-%d %H:%M')" || echo "brak zmian"
          git push
